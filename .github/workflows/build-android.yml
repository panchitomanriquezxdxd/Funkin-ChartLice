name: Build FNF Android APK (armeabi-v7a + arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'example_mods/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (both ABIs)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo + submodules (assets)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages + required NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          # CRITICAL: Lime only works with this specific NDK
          sdkmanager "ndk;29.0.13113456"

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install HMM + project dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Setup Lime
        run: |
          haxelib run lime setup -y || true

      - name: Configure Lime for Android
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.13113456"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config ANDROID_NDK_HOME "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

          echo "=== Lime Android config ==="
          haxelib run lime config ANDROID_SDK
          haxelib run lime config ANDROID_NDK_ROOT
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Android APK (armeabi-v7a + arm64-v8a)
        # Do NOT add -DEXCLUDE_ARMV7 → both architectures are included
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.13113456"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          haxelib run lime build android -release -final -v
        timeout-minutes: 150

      - name: Find generated APK
        id: find-apk
        run: |
          echo "Looking for APKs..."
          find export -type f -name "*.apk" -print || true
          APK=$(find export -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-ChartLice-Android-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
